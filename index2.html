<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registration - Step 1 of 5</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; font-size: 13px; margin: 30px; }

    .wrapper {
      width: 640px;
      border: 1px solid #0b6bb5;
      border-radius: 0 0 14px 14px;
      overflow: hidden;
      padding-top: 30px;
      background: #fff;
    }
    .step { text-align: center; color: #1a7bc4; font-weight: bold; font-size: 15px; margin: 0 0 4px; }

    form { margin: 0; }

    fieldset {
      border: 1px solid #a9cdee;
      border-radius: 4px;
      margin: 0 30px 0;
      padding: 8px 10px 10px;
    }
    legend { font-size: 12px; padding: 0 2px; }
    fieldset fieldset { margin: 6px 40px 6px 60px; padding: 6px 8px 8px; }
    fieldset fieldset legend { font-weight: bold; }

    .row { display: flex; align-items: center; margin: 5px 0; min-height: 30px; }
    .row label { width: 150px; padding-left: 80px; box-sizing: content-box; font-size: 12px; }
    fieldset fieldset .row label { width: 120px; padding-left: 0; }

    input[type="text"], input[type="password"] {
      width: 170px; height: 28px; box-sizing: border-box;
      border: 1px solid #a9cdee; border-radius: 3px; padding: 2px 6px;
    }
    select {
      height: 24px; border: 1px solid #a9cdee; border-radius: 3px;
      color: #777; font-size: 12px; background: #fff;
    }
    .gender .opts label { width: auto; padding: 0; margin-right: 6px; }
    .gender .opts { display: flex; align-items: center; }

    .buttons { text-align: center; margin: 4px 0 6px; }
    .buttons button {
      background: #3a9ad9; color: #fff; font-weight: bold; font-size: 12px;
      border: 1px solid #2f86c0; border-radius: 3px; padding: 6px 10px; margin: 0 3px; cursor: pointer;
    }

    footer {
      background: #0b6bb5; color: #fff; text-align: center;
      font-size: 10px; font-weight: bold; padding: 4px 0; margin-top: 4px;
    }
  </style>
</head>
<body>
  <p>2. Use HTML to come up with the following interface.</p>

  <div class="wrapper">
    <h2 class="step">Step 1 of 5</h2>

    <form action="#" method="post">
      <fieldset>
        <legend>Personal Information</legend>

        <div class="row">
          <label for="surname">Sur Name</label>
          <input type="text" id="surname" name="surname">
        </div>
        <div class="row">
          <label for="firstname">First Name</label>
          <input type="text" id="firstname" name="firstname">
        </div>
        <div class="row">
          <label for="othernames">Other Names</label>
          <input type="text" id="othernames" name="othernames">
        </div>

        <div class="row gender">
          <label>Gender</label>
          <div class="opts">
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
          </div>
        </div>

        <div class="row">
          <label for="marital">Marital Status</label>
          <select id="marital" name="marital">
            <option value="">Select - Status</option>
            <option value="single">Single</option>
            <option value="married">Married</option>
            <option value="divorced">Divorced</option>
            <option value="widowed">Widowed</option>
          </select>
        </div>

        <div class="row">
          <label for="dob">Date of Birth</label>
          <input type="text" id="dob" name="dob">
        </div>
        <div class="row">
          <label for="pob">Place of Birth</label>
          <input type="text" id="pob" name="pob">
        </div>
        <div class="row">
          <label for="mother">Mothers Name</label>
          <input type="text" id="mother" name="mother">
        </div>
        <div class="row">
          <label for="father">fathers Name</label>
          <input type="text" id="father" name="father">
        </div>

        <div class="row">
          <label for="dependants">number of Dependants</label>
          <select id="dependants" name="dependants">
            <option value="">Select - No of Dependants</option>
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5+">5 or more</option>
          </select>
        </div>

        <div class="row">
          <label for="education">level of Education</label>
          <input type="text" id="education" name="education">
        </div>

        <fieldset>
          <legend>Security Information</legend>

          <div class="row">
            <label for="username">UserName</label>
            <input type="text" id="username" name="username">
          </div>
          <div class="row">
            <label for="password">Password</label>
            <input type="password" id="password" name="password">
          </div>
          <div class="row">
            <label for="password2">Re-type Password</label>
            <input type="password" id="password2" name="password2">
          </div>
          <div class="row">
            <label for="question">Security Question</label>
            <select id="question" name="question" style="width: 170px;">
              <option value="">Select - Question</option>
              <option value="pet">What was your first pet's name?</option>
              <option value="school">What primary school did you attend?</option>
              <option value="city">In which city were you born?</option>
            </select>
          </div>
          <div class="row">
            <label for="answer">Answer</label>
            <input type="text" id="answer" name="answer">
          </div>
        </fieldset>

        <div class="buttons">
          <button type="button">Previous</button>
          <button type="submit">Next</button>
        </div>
      </fieldset>
    </form>

    <footer>Copyright &copy; 2011 all rights reserved</footer>
  </div>
</body>
</html>
